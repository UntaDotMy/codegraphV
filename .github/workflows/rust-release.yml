# Release of the Rust rewrite: prebuilt `codegraph` binaries on a GitHub Release.
#
# A push to rust-rewrite tests the workspace on each OS and builds every binary. A tag `v0.*`
# (or a manual run naming one) does the same, then publishes the archives with SHA256SUMS.
# It never publishes to npm; the upstream `release.yml` is the TypeScript package's flow.
name: Rust release

on:
  push:
    branches: [rust-rewrite]
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.0.1); must already exist
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        # Windows: link the C runtime statically so the exe needs no VC++ redistributable.
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build --release --locked -p codegraph-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          exe=codegraph; [ "${{ runner.os }}" = "Windows" ] && exe=codegraph.exe
          bin="target/${{ matrix.target }}/release/$exe"
          if [[ "$TAG" == v* && "${{ matrix.target }}" != "x86_64-apple-darwin" ]]; then
            version="$("$bin" --version)"
            [ "$version" = "codegraph ${TAG#v}" ] || { echo "binary says '$version', tag is $TAG"; exit 1; }
          fi
          dir="codegraph-${TAG}-${{ matrix.name }}"
          mkdir "$dir"
          cp "$bin" LICENSE README.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            codegraph-*.zip
            codegraph-*.tar.gz
          if-no-files-found: error

  release:
    needs: [test, build]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum codegraph-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "codegraph $TAG (Rust rewrite)" --notes-file "$notes" --verify-tag
