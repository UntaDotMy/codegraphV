[package]
name = "codegraph-extract"
description = "Tree-sitter extraction for the CodeGraph knowledge graph (port of src/extraction/*)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
codegraph-types.workspace = true
codegraph-jsre.workspace = true
codegraph-search.workspace = true
serde_json.workspace = true
indexmap.workspace = true
sha2.workspace = true
regex.workspace = true
pcre2 = "0.2"
tree-sitter = "0.25"
tree-sitter-language = "0.1"

# Grammars — revision-matched with the wasm grammars the TypeScript engine
# loads (src/extraction/wasm/ and the tree-sitter-wasms package), so the two
# engines see the same parse trees. Pins carry over from codegraph-kernel.
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-rust = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-r = "=1.2.0"
tree-sitter-luau = "=1.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
