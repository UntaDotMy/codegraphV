[package]
name = "codegraph-core"
description = "The CodeGraph engine: project directory, scanning, indexing orchestration and the CodeGraph facade (port of src/index.ts, src/extraction/index.ts, src/directory.ts, src/sync/*)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
codegraph-types.workspace = true
codegraph-db = { path = "../codegraph-db" }
codegraph-extract = { path = "../codegraph-extract" }
codegraph-resolve = { path = "../codegraph-resolve" }
codegraph-graph = { path = "../codegraph-graph" }
codegraph-context = { path = "../codegraph-context" }
codegraph-sync = { path = "../codegraph-sync" }
codegraph-search.workspace = true
codegraph-text = { path = "../codegraph-text" }
codegraph-jsre.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
regex.workspace = true
sha2.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
