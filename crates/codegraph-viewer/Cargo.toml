[package]
name = "codegraph-viewer"
description = "Rust/WASM browser client for the native CodeGraph API"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde_json.workspace = true
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
js-sys = "=0.3.82"
web-sys = { version = "=0.3.82", features = ["Window","Document","HtmlElement","Element","Node","Text","Event","EventTarget","MouseEvent","KeyboardEvent","HtmlInputElement","Location","History","Request","RequestInit","RequestMode","Response","Headers","console"] }

